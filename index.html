<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fork Trade</title>
    <!-- Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --green: #2ecc71;
            --red: #e74c3c;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --sidebar-width: 260px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Authentication ===== */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg);
        }
        .auth-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .auth-box h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--green);
            font-size: 28px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            text-align: center;
            font-weight: 500;
        }
        .tab-btn.active {
            background: var(--green);
            color: #fff;
            border-color: var(--green);
        }
        .auth-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--green);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .auth-btn:hover { opacity: 0.9; }
        .error {
            color: var(--red);
            text-align: center;
            min-height: 20px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        /* ===== Main App ===== */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            z-index: 20;
        }
        .top-bar .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--green);
            margin-right: auto;
        }
        .balance-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 16px;
            font-weight: 600;
            color: var(--green);
        }
        .icon-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text);
            font-size: 16px;
        }
        .icon-btn:hover { background: var(--border); }

        /* Chart Area */
        .chart-wrapper {
            flex: 1;
            position: relative;
            background: var(--bg);
            min-height: 0;
        }
        #chartContainer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Trade Panel */
        .trade-panel {
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            z-index: 15;
        }
        .trade-panel select, .trade-panel input {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--text);
            font-size: 14px;
        }
        .trade-panel .amount-input {
            width: 80px;
        }
        .trade-panel .duration-select {
            width: 100px;
        }
        .trade-btn {
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .trade-btn:active { transform: scale(0.95); }
        .up-btn { background: var(--green); color: #fff; }
        .down-btn { background: var(--red); color: #fff; }
        .trade-status {
            font-weight: 600;
            font-size: 14px;
            margin-left: 10px;
            min-width: 120px;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: -100%;
            top: 0;
            bottom: 0;
            width: 80%;
            max-width: 300px;
            background: var(--card);
            border-right: 1px solid var(--border);
            transition: left 0.3s;
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            text-align: center;
        }
        .market-group {
            padding: 10px;
        }
        .market-group-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 5px;
            padding-left: 5px;
        }
        .market-item {
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .market-item:hover {
            background: var(--bg);
        }
        .market-item.active {
            background: var(--green);
            color: #fff;
        }
        .market-price {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* History Drawer */
        .history-drawer {
            position: fixed;
            right: -300px;
            top: 0;
            bottom: 0;
            width: 280px;
            background: var(--card);
            border-left: 1px solid var(--border);
            transition: right 0.3s;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        .history-drawer.open {
            right: 0;
        }
        .history-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .win { color: var(--green); }
        .loss { color: var(--red); }

        /* Overlay for mobile sidebar */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            display: none;
        }
        .overlay.show {
            display: block;
        }

        @media (max-width: 768px) {
            .trade-panel {
                justify-content: center;
            }
            .trade-status {
                width: 100%;
                text-align: center;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== AUTH PAGE ==================== -->
    <div id="authPage" class="auth-container">
        <div class="auth-box">
            <h1>Fork Trade</h1>
            <div class="tabs">
                <button class="tab-btn active" id="loginTab" onclick="switchAuth('login')">Login</button>
                <button class="tab-btn" id="signupTab" onclick="switchAuth('signup')">Sign Up</button>
            </div>
            <div id="loginForm">
                <input type="text" class="auth-input" id="loginUsername" placeholder="Username">
                <input type="password" class="auth-input" id="loginPassword" placeholder="Password">
                <div class="error" id="loginError"></div>
                <button class="auth-btn" onclick="login()">Login</button>
            </div>
            <div id="signupForm" style="display: none;">
                <input type="text" class="auth-input" id="signupUsername" placeholder="Username">
                <input type="password" class="auth-input" id="signupPassword" placeholder="Password">
                <div class="error" id="signupError"></div>
                <button class="auth-btn" onclick="signup()">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- ==================== MAIN APP ==================== -->
    <div id="appPage" style="display:none;" class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <span class="logo">Fork Trade</span>
            <div class="balance-box" id="balanceDisplay">$10,000.00</div>
            <button class="icon-btn" onclick="resetBalance()" title="Reset Balance">↻</button>
            <button class="icon-btn" onclick="toggleHistory()" title="History">📋</button>
            <button class="icon-btn" onclick="logout()" title="Logout">⏻</button>
        </div>

        <!-- Chart -->
        <div class="chart-wrapper" id="chartWrapper">
            <div id="chartContainer"></div>
        </div>

        <!-- Trade Panel (bottom) -->
        <div class="trade-panel">
            <input type="number" class="amount-input" id="tradeAmount" value="100" min="1" step="1">
            <select class="duration-select" id="durationSelect">
                <option value="10">10s</option>
                <option value="30">30s</option>
                <option value="60">1m</option>
                <option value="300">5m</option>
                <option value="900">15m</option>
                <option value="1800">30m</option>
            </select>
            <button class="trade-btn up-btn" onclick="placeTrade('up')">▲</button>
            <button class="trade-btn down-btn" onclick="placeTrade('down')">▼</button>
            <div class="trade-status" id="tradeStatus"></div>
            <button class="icon-btn" onclick="toggleSidebar()" title="Markets" style="margin-left:auto;">☰ Markets</button>
        </div>

        <!-- Sidebar -->
        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">Markets</div>
            <div id="marketList"></div>
        </div>

        <!-- History Drawer -->
        <div class="history-drawer" id="historyDrawer">
            <div class="history-header">
                <span>Trade History</span>
                <button class="icon-btn" onclick="toggleHistory()">✕</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        // ==================== DATA & STATE ====================
        const markets = {
            "Forex": [
                { symbol: "EUR/USD", name: "Euro/US Dollar" },
                { symbol: "GBP/USD", name: "Pound/US Dollar" },
                { symbol: "USD/JPY", name: "Dollar/Japanese Yen" },
                { symbol: "AUD/USD", name: "Australian Dollar/US Dollar" },
            ],
            "Cryptocurrency": [
                { symbol: "BTC/USD", name: "Bitcoin/US Dollar" },
                { symbol: "ETH/USD", name: "Ethereum/US Dollar" },
                { symbol: "BNB/USD", name: "Binance Coin/US Dollar" },
                { symbol: "XRP/USD", name: "Ripple/US Dollar" },
            ],
            "Stocks": [
                { symbol: "AAPL", name: "Apple Inc." },
                { symbol: "GOOGL", name: "Alphabet Inc." },
                { symbol: "TSLA", name: "Tesla Inc." },
            ],
            "Bangladesh": [
                { symbol: "BDT/USD", name: "Bangladeshi Taka/US Dollar" },
                { symbol: "DSE", name: "Dhaka Stock Exchange" },
            ]
        };

        let users = JSON.parse(localStorage.getItem('users')) || [];
        let currentUser = null;
        let balance = 10000;
        let activeTrade = null;
        let tradeTimer = null;
        let tradeStartPrice = 0;
        let trades = JSON.parse(localStorage.getItem('trades')) || [];

        let chart = null;
        let candleSeries = null;
        let currentAsset = "EUR/USD";
        let currentTimeframe = 60; // seconds
        let priceInterval = null;
        let currentCandle = null;
        let priceHistory = {};

        // ==================== AUTH FUNCTIONS ====================
        function switchAuth(mode) {
            document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('signupForm').style.display = mode === 'signup' ? 'block' : 'none';
            document.getElementById('loginTab').classList.toggle('active', mode === 'login');
            document.getElementById('signupTab').classList.toggle('active', mode === 'signup');
        }

        function signup() {
            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;
            if (!username || !password) {
                document.getElementById('signupError').textContent = 'Please fill all fields';
                return;
            }
            if (users.find(u => u.username === username)) {
                document.getElementById('signupError').textContent = 'Username already exists';
                return;
            }
            users.push({ username, password });
            localStorage.setItem('users', JSON.stringify(users));
            alert('Account created! Please login.');
            switchAuth('login');
            document.getElementById('loginUsername').value = username;
        }

        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const user = users.find(u => u.username === username && u.password === password);
            if (!user) {
                document.getElementById('loginError').textContent = 'Invalid username or password';
                return;
            }
            currentUser = user;
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('appPage').style.display = 'flex';
            resetBalance();
            initChart();
            initMarkets();
            startPriceSimulation();
            updateHistory();
        }

        function logout() {
            if (priceInterval) clearInterval(priceInterval);
            currentUser = null;
            document.getElementById('authPage').style.display = 'flex';
            document.getElementById('appPage').style.display = 'none';
            if (chart) {
                chart.remove();
                chart = null;
            }
        }

        function resetBalance() {
            balance = 10000;
            updateBalanceDisplay();
        }
        function updateBalanceDisplay() {
            document.getElementById('balanceDisplay').textContent = '$' + balance.toFixed(2);
        }

        // ==================== MARKET SIDEBAR ====================
        function initMarkets() {
            const container = document.getElementById('marketList');
            container.innerHTML = '';
            for (const group in markets) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'market-group';
                groupDiv.innerHTML = `<div class="market-group-title">${group}</div>`;
                markets[group].forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'market-item' + (m.symbol === currentAsset ? ' active' : '');
                    item.innerHTML = `<span>${m.symbol}</span><span class="market-price">--</span>`;
                    item.onclick = () => { selectMarket(m.symbol); toggleSidebar(); };
                    groupDiv.appendChild(item);
                });
                container.appendChild(groupDiv);
            }
        }

        function selectMarket(symbol) {
            currentAsset = symbol;
            document.querySelectorAll('.market-item').forEach(el => {
                el.classList.toggle('active', el.firstChild.textContent === symbol);
            });
            initAssetData(symbol);
            candleSeries.setData(priceHistory[symbol].candles);
            chart.timeScale().fitContent();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        // ==================== CHART ====================
        function initChart() {
            const container = document.getElementById('chartContainer');
            if (chart) chart.remove();
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: { background: { color: '#0d1117' }, textColor: '#e6edf3' },
                grid: { vertLines: { color: '#30363d' }, horzLines: { color: '#30363d' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { timeVisible: true, secondsVisible: false },
                priceScale: {
                    borderColor: '#30363d',
                    scaleMargins: { top: 0.2, bottom: 0.2 },
                },
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#2ecc71', downColor: '#e74c3c', borderVisible: false,
                wickUpColor: '#2ecc71', wickDownColor: '#e74c3c',
            });

            // Custom price scale coloring (green when up, red when down)
            const originalPriceScale = chart.priceScale();
            originalPriceScale.applyOptions({
                borderColor: '#30363d',
            });

            initAssetData(currentAsset);
            candleSeries.setData(priceHistory[currentAsset].candles);
            chart.timeScale().fitContent();

            // Auto scroll on new candle
            chart.timeScale().scrollToPosition(5, false);
        }

        function initAssetData(symbol) {
            if (!priceHistory[symbol]) {
                priceHistory[symbol] = { currentPrice: 100, candles: [] };
                let time = Math.floor(Date.now() / 1000) - 120 * currentTimeframe;
                let price = 100;
                for (let i = 0; i < 120; i++) {
                    const open = price;
                    const close = open + (Math.random() - 0.5) * 2;
                    const high = Math.max(open, close) + Math.random() * 0.5;
                    const low = Math.min(open, close) - Math.random() * 0.5;
                    priceHistory[symbol].candles.push({ time, open, high, low, close });
                    price = close;
                    time += currentTimeframe;
                }
                priceHistory[symbol].currentPrice = price;
            }
            currentCandle = null;
        }

        // ==================== PRICE SIMULATION (Stable) ====================
        function startPriceSimulation() {
            if (priceInterval) clearInterval(priceInterval);
            priceInterval = setInterval(() => {
                simulateTick(currentAsset);
            }, 200); // 5 updates per second - smooth but stable
        }

        function simulateTick(symbol) {
            if (!priceHistory[symbol]) return;
            const data = priceHistory[symbol];
            // Use smoother random movement
            const change = (Math.random() - 0.5) * 0.05;
            const newPrice = Math.max(0.01, data.currentPrice + change);
            data.currentPrice = newPrice;

            const now = Math.floor(Date.now() / 1000);
            if (!currentCandle || (now - currentCandle.time) >= currentTimeframe) {
                if (currentCandle) {
                    currentCandle.close = newPrice;
                    candleSeries.update(currentCandle);
                }
                currentCandle = {
                    time: now,
                    open: newPrice,
                    high: newPrice,
                    low: newPrice,
                    close: newPrice,
                };
                candleSeries.update(currentCandle);
                // Auto-scroll to show latest candle
                chart.timeScale().scrollToPosition(5, false);
            } else {
                currentCandle.high = Math.max(currentCandle.high, newPrice);
                currentCandle.low = Math.min(currentCandle.low, newPrice);
                currentCandle.close = newPrice;
                candleSeries.update(currentCandle);
            }

            // Update sidebar price
            document.querySelectorAll('.market-item').forEach(el => {
                if (el.firstChild.textContent === symbol) {
                    el.querySelector('.market-price').textContent = newPrice.toFixed(4);
                }
            });

            // Update price scale color based on last candle direction
            if (currentCandle) {
                const lastCandle = priceHistory[symbol].candles[priceHistory[symbol].candles.length - 1];
                if (lastCandle && currentCandle.close >= lastCandle.open) {
                    chart.priceScale().applyOptions({ borderColor: '#2ecc71' });
                } else {
                    chart.priceScale().applyOptions({ borderColor: '#e74c3c' });
                }
            }

            if (activeTrade && activeTrade.asset === symbol) {
                checkTradeOutcome();
            }
        }

        // ==================== TRADING ====================
        function placeTrade(direction) {
            if (!currentUser) return;
            if (activeTrade) {
                document.getElementById('tradeStatus').textContent = 'Trade already active!';
                return;
            }
            const amount = parseFloat(document.getElementById('tradeAmount').value);
            if (isNaN(amount) || amount <= 0 || amount > balance) {
                alert('Invalid amount');
                return;
            }
            const durationSec = parseInt(document.getElementById('durationSelect').value);
            const startPrice = priceHistory[currentAsset].currentPrice;
            activeTrade = {
                asset: currentAsset,
                direction,
                amount,
                startPrice,
                startTime: Date.now(),
                duration: durationSec * 1000,
            };
            balance -= amount;
            updateBalanceDisplay();
            document.getElementById('tradeStatus').textContent = `Trade: ${currentAsset} ${direction.toUpperCase()}`;
            tradeTimer = setTimeout(finishTrade, activeTrade.duration);
        }

        function finishTrade() {
            const currentPrice = priceHistory[activeTrade.asset].currentPrice;
            const win = activeTrade.direction === 'up' ? currentPrice > activeTrade.startPrice : currentPrice < activeTrade.startPrice;
            const profit = win ? activeTrade.amount * 0.8 : -activeTrade.amount;
            balance += activeTrade.amount + profit;
            updateBalanceDisplay();
            const result = win ? 'WIN' : 'LOSS';
            document.getElementById('tradeStatus').textContent = `${result} ${profit >= 0 ? '+' : ''}${profit.toFixed(2)}`;
            trades.push({
                user: currentUser.username,
                asset: activeTrade.asset,
                direction: activeTrade.direction,
                amount: activeTrade.amount,
                profit,
                time: new Date().toLocaleString()
            });
            localStorage.setItem('trades', JSON.stringify(trades));
            updateHistory();
            activeTrade = null;
            clearTimeout(tradeTimer);
        }

        function checkTradeOutcome() {}

        // ==================== HISTORY ====================
        function toggleHistory() {
            document.getElementById('historyDrawer').classList.toggle('open');
        }

        function updateHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            const userTrades = trades.filter(t => t.user === currentUser?.username);
            if (userTrades.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#8b949e; padding:20px;">No trades yet</div>';
                return;
            }
            userTrades.slice(-100).reverse().forEach(t => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<span>${t.asset} ${t.direction}</span>
                                <span class="${t.profit >= 0 ? 'win' : 'loss'}">${t.profit >= 0 ? '+' : ''}${t.profit.toFixed(2)}</span>`;
                list.appendChild(div);
            });
        }

        // ==================== INITIALIZATION ====================
        document.getElementById('authPage').style.display = 'flex';
        document.getElementById('appPage').style.display = 'none';
    </script>
</body>
  </html>
