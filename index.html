<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fork Trade</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --green: #2ecc71;
            --red: #e74c3c;
            --text: #e6edf3;
            --text-muted: #8b949e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Auth */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg);
        }
        .auth-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .auth-box h1 { text-align: center; margin-bottom: 20px; color: var(--green); font-size: 28px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 10px; background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); cursor: pointer; text-align: center; font-weight: 500;
        }
        .tab-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
        .auth-input {
            width: 100%; padding: 12px; margin-bottom: 12px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 16px;
        }
        .auth-btn {
            width: 100%; padding: 12px; background: var(--green); border: none; border-radius: 8px;
            color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .error { color: var(--red); text-align: center; min-height: 20px; margin-bottom: 10px; font-size: 14px; }

        /* App */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        .top-bar {
            display: flex; align-items: center; gap: 10px; padding: 8px 12px;
            background: var(--card); border-bottom: 1px solid var(--border); flex-wrap: wrap; z-index: 30; min-height: 50px;
        }
        .logo { font-size: 18px; font-weight: 700; color: var(--green); margin-right: auto; }
        .balance-box {
            background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
            padding: 4px 10px; font-size: 14px; font-weight: 600; color: var(--green);
        }
        .icon-btn {
            background: var(--bg); border: 1px solid var(--border); border-radius: 50%;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text); font-size: 14px;
        }

        /* Chart */
        .chart-wrapper { flex: 1; position: relative; background: var(--bg); min-height: 0; overflow: hidden; }
        #chartContainer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

        /* Trade Controls */
        .trade-controls {
            position: absolute; top: 8px; left: 8px; right: 8px;
            background: rgba(22, 27, 34, 0.9); border: 1px solid var(--border);
            border-radius: 12px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px;
            align-items: center; z-index: 20; backdrop-filter: blur(5px);
        }
        .field-group {
            display: flex; align-items: center; gap: 4px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
        }
        .field-group label { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
        .field-group input, .field-group select {
            background: transparent; border: none; color: var(--text); font-size: 13px; outline: none; min-width: 0;
        }
        .field-group input { width: 55px; }
        .field-group select { width: 65px; }
        .trade-btn {
            border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: transform 0.1s; white-space: nowrap;
        }
        .trade-btn:active { transform: scale(0.95); }
        .up-btn { background: var(--green); color: #fff; }
        .down-btn { background: var(--red); color: #fff; }
        .market-btn {
            background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
            padding: 8px 10px; color: var(--text); font-size: 13px; cursor: pointer; white-space: nowrap;
        }

        /* Trade Overlay */
        .trade-overlay {
            position: absolute; top: 55px; left: 8px; right: 8px;
            display: flex; flex-wrap: wrap; gap: 6px; z-index: 15;
        }
        .trade-info-card {
            background: rgba(22, 27, 34, 0.8); border: 1px solid var(--border);
            border-radius: 6px; padding: 4px 8px; font-size: 11px; display: flex; align-items: center; gap: 5px;
        }
        .profit-positive { color: var(--green); }
        .profit-negative { color: var(--red); }

        /* Candle Timer */
        .price-scale-timer {
            position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.6); color: #fff; padding: 2px 6px; border-radius: 4px;
            font-size: 11px; z-index: 10; pointer-events: none;
        }

        /* Bottom Notification */
        .bottom-notification {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 6px 12px; border-radius: 20px;
            font-size: 12px; z-index: 25; display: none; text-align: center; max-width: 90%;
        }

        /* Sidebar */
        .sidebar {
            position: fixed; left: -100%; top: 0; bottom: 0; width: 80%; max-width: 300px;
            background: var(--card); border-right: 1px solid var(--border); transition: left 0.3s;
            z-index: 100; display: flex; flex-direction: column; overflow-y: auto;
        }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); font-weight: 600; text-align: center; }
        .market-group { padding: 10px; }
        .market-group-title { font-size: 14px; color: var(--text-muted); margin-bottom: 5px; padding-left: 5px; }
        .market-item {
            padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex;
            justify-content: space-between; align-items: center; font-size: 14px;
        }
        .market-item:hover { background: var(--bg); }
        .market-item.active { background: var(--green); color: #fff; }
        .market-price { font-size: 12px; color: var(--text-muted); }

        /* History Drawer */
        .history-drawer {
            position: fixed; right: -300px; top: 0; bottom: 0; width: 280px;
            background: var(--card); border-left: 1px solid var(--border); transition: right 0.3s;
            z-index: 100; display: flex; flex-direction: column;
        }
        .history-drawer.open { right: 0; }
        .history-header {
            padding: 15px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        .history-item {
            display: flex; justify-content: space-between; padding: 8px;
            border-bottom: 1px solid var(--border); font-size: 13px;
        }
        .win { color: var(--green); }
        .loss { color: var(--red); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 99; display: none;
        }
        .overlay.show { display: block; }

        @media (max-width: 600px) {
            .trade-controls { padding: 6px; }
            .field-group { padding: 3px 5px; }
            .trade-btn { padding: 7px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- Auth Page -->
    <div id="authPage" class="auth-container">
        <div class="auth-box">
            <h1>Fork Trade</h1>
            <div class="tabs">
                <button class="tab-btn active" id="loginTab" onclick="switchAuth('login')">Login</button>
                <button class="tab-btn" id="signupTab" onclick="switchAuth('signup')">Sign Up</button>
            </div>
            <div id="loginForm">
                <input type="text" class="auth-input" id="loginUsername" placeholder="Username">
                <input type="password" class="auth-input" id="loginPassword" placeholder="Password">
                <div class="error" id="loginError"></div>
                <button class="auth-btn" onclick="login()">Login</button>
            </div>
            <div id="signupForm" style="display: none;">
                <input type="text" class="auth-input" id="signupUsername" placeholder="Username">
                <input type="password" class="auth-input" id="signupPassword" placeholder="Password">
                <div class="error" id="signupError"></div>
                <button class="auth-btn" onclick="signup()">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="appPage" class="app-container" style="display:none;">
        <div class="top-bar">
            <span class="logo">Fork Trade</span>
            <div class="balance-box" id="balanceDisplay">$10,000.00</div>
            <button class="icon-btn" onclick="resetBalance()" title="Reset">↻</button>
            <button class="icon-btn" onclick="toggleHistory()" title="History">📋</button>
            <button class="icon-btn" onclick="logout()" title="Logout">⏻</button>
        </div>

        <div class="chart-wrapper">
            <div id="chartContainer"></div>
            <div class="trade-controls">
                <div class="field-group">
                    <label>$</label>
                    <input type="number" id="tradeAmount" value="100" min="1" step="1">
                </div>
                <div class="field-group">
                    <label>⏱</label>
                    <select id="durationSelect">
                        <option value="10">10s</option>
                        <option value="30">30s</option>
                        <option value="60">1m</option>
                        <option value="300">5m</option>
                        <option value="900">15m</option>
                        <option value="1800">30m</option>
                    </select>
                </div>
                <button class="trade-btn up-btn" onclick="placeTrade('up')">▲ UP</button>
                <button class="trade-btn down-btn" onclick="placeTrade('down')">▼ DOWN</button>
                <button class="market-btn" onclick="toggleSidebar()">☰ Markets</button>
            </div>
            <div class="trade-overlay" id="tradeOverlay"></div>
            <div class="price-scale-timer" id="candleTimer"></div>
            <div class="bottom-notification" id="bottomNotification"></div>
        </div>

        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">Markets</div>
            <div id="marketList"></div>
        </div>

        <div class="history-drawer" id="historyDrawer">
            <div class="history-header">
                <span>Trade History</span>
                <button class="icon-btn" onclick="toggleHistory()">✕</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCJiKfPbm6AP7f3aJzOBdJjG_wqkIB_vxY",
            authDomain: "ashik-b2899.firebaseapp.com",
            projectId: "ashik-b2899",
            storageBucket: "ashik-b2899.firebasestorage.app",
            messagingSenderId: "832440096911",
            appId: "1:832440096911:web:982eca7ddab1ae3e4c78fa",
            measurementId: "G-FWGER29TLJ"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Markets
        const markets = {
            "Forex": [
                { symbol: "EUR/USD" }, { symbol: "GBP/USD" }, { symbol: "USD/JPY" }, { symbol: "AUD/USD" }
            ],
            "Crypto": [
                { symbol: "BTC/USD" }, { symbol: "ETH/USD" }, { symbol: "BNB/USD" }, { symbol: "XRP/USD" }
            ],
            "Stocks": [
                { symbol: "AAPL" }, { symbol: "GOOGL" }, { symbol: "TSLA" }
            ],
            "Bangladesh": [
                { symbol: "BDT/USD" }, { symbol: "DSE" }
            ]
        };

        // State
        let currentUser = null;
        let balance = 10000;
        let activeTrades = [];
        let chart = null;
        let candleSeries = null;
        let currentAsset = "EUR/USD";
        let currentTimeframe = 60;
        let priceInterval = null;
        let candleTimerInterval = null;
        let currentCandle = null;
        let priceHistory = {};

        // Auth functions
        function switchAuth(mode) {
            document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('signupForm').style.display = mode === 'signup' ? 'block' : 'none';
            document.getElementById('loginTab').classList.toggle('active', mode === 'login');
            document.getElementById('signupTab').classList.toggle('active', mode === 'signup');
        }

        async function signup() {
            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;
            if (!username || !password) return document.getElementById('signupError').textContent = 'Fill all fields';
            try {
                const query = await db.collection('users').where('username', '==', username).get();
                if (!query.empty) return document.getElementById('signupError').textContent = 'User exists';
                await db.collection('users').add({ username, password, balance: 10000 });
                alert('Account created!');
                switchAuth('login');
                document.getElementById('loginUsername').value = username;
            } catch (e) {
                console.error(e);
                document.getElementById('signupError').textContent = 'Error creating account';
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            try {
                const query = await db.collection('users').where('username', '==', username).where('password', '==', password).get();
                if (query.empty) return document.getElementById('loginError').textContent = 'Invalid credentials';
                currentUser = { id: query.docs[0].id, ...query.docs[0].data() };
                document.getElementById('authPage').style.display = 'none';
                document.getElementById('appPage').style.display = 'flex';
                await loadUserData();
                initChart();
                initMarkets();
                startPriceSimulation();
                updateHistory();
            } catch (e) {
                console.error(e);
                document.getElementById('loginError').textContent = 'Login error';
            }
        }

        async function logout() {
            if (priceInterval) clearInterval(priceInterval);
            if (candleTimerInterval) clearInterval(candleTimerInterval);
            activeTrades.forEach(t => {
                if (t.priceLine) candleSeries.removePriceLine(t.priceLine);
            });
            activeTrades = [];
            currentUser = null;
            document.getElementById('authPage').style.display = 'flex';
            document.getElementById('appPage').style.display = 'none';
            if (chart) { chart.remove(); chart = null; }
        }

        // Firestore data
        async function loadUserData() {
            if (!currentUser) return;
            try {
                const doc = await db.collection('users').doc(currentUser.id).get();
                if (doc.exists && doc.data().balance !== undefined) {
                    balance = doc.data().balance;
                } else {
                    balance = 10000;
                    await db.collection('users').doc(currentUser.id).update({ balance: 10000 });
                }
                updateBalanceDisplay();
                // Load recent trades
                const tradesSnap = await db.collection('users').doc(currentUser.id).collection('trades').orderBy('time', 'desc').limit(100).get();
                trades = [];
                tradesSnap.forEach(doc => trades.push(doc.data()));
            } catch (e) {
                console.error(e);
            }
        }

        async function saveBalance() {
            if (!currentUser) return;
            await db.collection('users').doc(currentUser.id).update({ balance });
        }

        async function resetBalance() {
            balance = 10000;
            updateBalanceDisplay();
            await saveBalance();
        }

        function updateBalanceDisplay() {
            document.getElementById('balanceDisplay').textContent = '$' + balance.toFixed(2);
        }

        // Markets
        function initMarkets() {
            const container = document.getElementById('marketList');
            container.innerHTML = '';
            for (const group in markets) {
                const gd = document.createElement('div');
                gd.className = 'market-group';
                gd.innerHTML = `<div class="market-group-title">${group}</div>`;
                markets[group].forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'market-item' + (m.symbol === currentAsset ? ' active' : '');
                    item.innerHTML = `<span>${m.symbol}</span><span class="market-price">--</span>`;
                    item.onclick = () => { selectMarket(m.symbol); toggleSidebar(); };
                    gd.appendChild(item);
                });
                container.appendChild(gd);
            }
        }

        function selectMarket(symbol) {
            currentAsset = symbol;
            document.querySelectorAll('.market-item').forEach(el => el.classList.toggle('active', el.firstChild.textContent === symbol));
            initAssetData(symbol);
            candleSeries.setData(priceHistory[symbol].candles);
            chart.timeScale().scrollToPosition(5, false);
            updateSidebarPrice(symbol);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        // Chart
        function initChart() {
            const container = document.getElementById('chartContainer');
            if (chart) chart.remove();
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: { background: { color: '#0d1117' }, textColor: '#e6edf3' },
                grid: { vertLines: { color: '#30363d' }, horzLines: { color: '#30363d' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { 
                    timeVisible: true, 
                    secondsVisible: false,
                    barSpacing: 12,          // ← default spacing for readable candles
                    rightOffset: 2
                },
            });
            candleSeries = chart.addCandlestickSeries({
                upColor: '#2ecc71', downColor: '#e74c3c', borderVisible: false,
                wickUpColor: '#2ecc71', wickDownColor: '#e74c3c',
            });
            initAssetData(currentAsset);
            candleSeries.setData(priceHistory[currentAsset].candles);
            // Show last 30 candles instead of all (prevents too small view)
            const totalCandles = priceHistory[currentAsset].candles.length;
            chart.timeScale().setVisibleLogicalRange({
                from: Math.max(0, totalCandles - 30),
                to: totalCandles + 2
            });
        }

        async function initAssetData(symbol) {
            if (!priceHistory[symbol]) {
                priceHistory[symbol] = { currentPrice: 100, candles: [] };
                let time = Math.floor(Date.now()/1000) - 120 * currentTimeframe;
                let price = 100;
                for (let i=0; i<120; i++) {
                    const open = price;
                    const close = open + (Math.random()-0.5)*2;
                    const high = Math.max(open,close)+Math.random()*0.5;
                    const low = Math.min(open,close)-Math.random()*0.5;
                    priceHistory[symbol].candles.push({ time, open, high, low, close });
                    price = close;
                    time += currentTimeframe;
                }
                priceHistory[symbol].currentPrice = price;
            }
            currentCandle = null;
            if (symbol.includes('/USD') && !['EUR/USD','GBP/USD','USD/JPY','AUD/USD','BDT/USD'].includes(symbol)) {
                await fetchRealCryptoData(symbol);
            }
        }

        async function fetchRealCryptoData(symbol) {
            try {
                const base = symbol.split('/')[0];
                const interval = currentTimeframe <= 60 ? '1m' : currentTimeframe <= 300 ? '5m' : currentTimeframe <= 900 ? '15m' : '30m';
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${base}USDT&interval=${interval}&limit=120`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const candles = data.map(d => ({
                        time: Math.floor(d[0]/1000),
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    }));
                    priceHistory[symbol].candles = candles;
                    priceHistory[symbol].currentPrice = candles[candles.length-1].close;
                }
            } catch (e) {
                console.warn('Error fetching crypto data', e);
            }
        }

        // Price simulation
        function startPriceSimulation() {
            if (priceInterval) clearInterval(priceInterval);
            if (candleTimerInterval) clearInterval(candleTimerInterval);
            priceInterval = setInterval(() => simulateTick(currentAsset), 300);
            candleTimerInterval = setInterval(updateCandleTimer, 100);
        }

        function simulateTick(symbol) {
            if (!priceHistory[symbol]) return;
            const data = priceHistory[symbol];
            const change = (Math.random() - 0.5) * 0.03;
            const newPrice = Math.max(0.01, data.currentPrice + change);
            data.currentPrice = newPrice;
            const now = Math.floor(Date.now()/1000);
            if (!currentCandle || (now - currentCandle.time) >= currentTimeframe) {
                if (currentCandle) { currentCandle.close = newPrice; candleSeries.update(currentCandle); }
                currentCandle = { time: now, open: newPrice, high: newPrice, low: newPrice, close: newPrice };
                candleSeries.update(currentCandle);
                chart.timeScale().scrollToPosition(5, false);
            } else {
                currentCandle.high = Math.max(currentCandle.high, newPrice);
                currentCandle.low = Math.min(currentCandle.low, newPrice);
                currentCandle.close = newPrice;
                candleSeries.update(currentCandle);
            }
            updateSidebarPrice(symbol);
            updateTradeOverlay();
        }

        function updateSidebarPrice(symbol) {
            if (!priceHistory[symbol]) return;
            const price = priceHistory[symbol].currentPrice;
            document.querySelectorAll('.market-item').forEach(el => {
                if (el.firstChild.textContent === symbol) {
                    el.querySelector('.market-price').textContent = price.toFixed(4);
                }
            });
        }

        function updateCandleTimer() {
            if (!currentCandle) return;
            const now = Math.floor(Date.now()/1000);
            const remaining = Math.max(0, currentTimeframe - (now - currentCandle.time));
            document.getElementById('candleTimer').textContent = `⏳ ${remaining}s`;
            updateTradeOverlay();
        }

        // Trading
        function placeTrade(direction) {
            if (!currentUser) return;
            const amount = parseFloat(document.getElementById('tradeAmount').value);
            if (isNaN(amount) || amount <= 0 || amount > balance) return alert('Invalid amount');
            const durationSec = parseInt(document.getElementById('durationSelect').value);
            const startPrice = priceHistory[currentAsset].currentPrice;
            const priceLine = candleSeries.createPriceLine({
                price: startPrice,
                color: direction === 'up' ? '#2ecc71' : '#e74c3c',
                lineWidth: 2,
                lineStyle: LightweightCharts.LineStyle.Dotted,
                axisLabelVisible: true,
                title: direction.toUpperCase(),
            });
            const trade = {
                id: Date.now(),
                asset: currentAsset,
                direction,
                amount,
                startPrice,
                startTime: Date.now(),
                duration: durationSec * 1000,
                priceLine,
                status: 'active'
            };
            activeTrades.push(trade);
            balance -= amount;
            updateBalanceDisplay();
            saveBalance();
            updateTradeOverlay();
            showNotification(`${currentAsset} ${direction.toUpperCase()} $${amount} trade placed`);
            setTimeout(() => finishTrade(trade.id), trade.duration);
        }

        async function finishTrade(id) {
            const trade = activeTrades.find(t => t.id === id);
            if (!trade) return;
            candleSeries.removePriceLine(trade.priceLine);
            const currentPrice = priceHistory[trade.asset].currentPrice;
            const win = trade.direction === 'up' ? currentPrice > trade.startPrice : currentPrice < trade.startPrice;
            const profit = win ? trade.amount * 0.8 : -trade.amount;
            balance += trade.amount + profit;
            updateBalanceDisplay();
            await saveBalance();
            const tradeRecord = {
                user: currentUser.username,
                asset: trade.asset,
                direction: trade.direction,
                amount: trade.amount,
                profit,
                time: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('users').doc(currentUser.id).collection('trades').add(tradeRecord);
            activeTrades = activeTrades.filter(t => t.id !== id);
            updateTradeOverlay();
            updateHistory();
            showNotification(win ? `✅ WIN +$${profit.toFixed(2)}` : `❌ LOSS -$${Math.abs(profit).toFixed(2)}`);
        }

        function updateTradeOverlay() {
            const overlay = document.getElementById('tradeOverlay');
            if (!overlay) return;
            overlay.innerHTML = '';
            if (activeTrades.length === 0) {
                overlay.style.display = 'none';
                return;
            }
            overlay.style.display = 'flex';
            activeTrades.forEach(t => {
                const div = document.createElement('div');
                div.className = 'trade-info-card';
                const currentPrice = priceHistory[t.asset]?.currentPrice || 0;
                const diff = currentPrice - t.startPrice;
                const profit = t.direction === 'up' ? diff : -diff;
                const cls = profit >= 0 ? 'profit-positive' : 'profit-negative';
                const remaining = Math.max(0, Math.ceil((t.startTime + t.duration - Date.now())/1000));
                div.innerHTML = `<span>${t.asset}</span> <span>${t.direction.toUpperCase()}</span> <span class="${cls}">${profit.toFixed(4)}</span> <span>⏳${remaining}s</span>`;
                overlay.appendChild(div);
            });
        }

        // Notification
        function showNotification(message) {
            const el = document.getElementById('bottomNotification');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        // History
        async function updateHistory() {
            if (!currentUser) return;
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            try {
                const snap = await db.collection('users').doc(currentUser.id).collection('trades').orderBy('time', 'desc').limit(100).get();
                if (snap.empty) {
                    list.innerHTML = '<div style="text-align:center; color:#8b949e; padding:20px;">No trades yet</div>';
                    return;
                }
                snap.forEach(doc => {
                    const t = doc.data();
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `<span>${t.asset} ${t.direction}</span> <span class="${t.profit >= 0 ? 'win' : 'loss'}">${t.profit >= 0 ? '+' : ''}${t.profit.toFixed(2)}</span>`;
                    list.appendChild(div);
                });
            } catch (e) {
                console.error(e);
            }
        }

        function toggleHistory() {
            document.getElementById('historyDrawer').classList.toggle('open');
        }

        // Initialize
        document.getElementById('authPage').style.display = 'flex';
        document.getElementById('appPage').style.display = 'none';
    </script>
</body>
  </html>
